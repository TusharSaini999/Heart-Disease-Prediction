name: Stale Issues and PRs
on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v8
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'This issue has been inactive for 30 days. It will be closed in 7 days if no activity occurs.'
          stale-pr-message: 'This PR has been inactive for 30 days. It will be closed in 7 days if no activity occurs.'
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          days-before-stale: 30
          days-before-close: 7
          exempt-issue-labels: 'pinned,security'
          exempt-pr-labels: 'pinned,security'
