name: Pull Request
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Check PR title
        uses: actions/github-script@v6
        with:
          script: |
            const title = context.payload.pull_request.title;
            const validPrefixes = ['[BUG]', '[FEATURE]', '[REFACTOR]', '[DOCS]', '[TEST]'];
            const hasValidPrefix = validPrefixes.some(prefix => title.startsWith(prefix));
            
            if (!hasValidPrefix) {
              core.setFailed('PR title must start with one of: ' + validPrefixes.join(', '));
            }
      
      - name: Comment on PR
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Thank you for submitting this pull request! 🎉\n\nPlease make sure to:\n- [ ] Update documentation\n- [ ] Add tests if applicable\n- [ ] Ensure all checks pass'
            })
